version: '3.8'

services:
  neo4j:
    image: neo4j
    container_name: math-buddy-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_security_procedures_allowlist=gds.*
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
      - "NEO4J_server_jvm_additional=-Djol.skipHotspotSAAttach=true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
    networks:
      - math-buddy-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  data-loader:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: math-buddy-data-loader
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SQLALCHEMY_DATABASE_URL=sqlite:///./logs.db
    depends_on:
      neo4j:
        condition: service_healthy
    command: bash -c "chmod +x /app/load_data.sh && /app/load_data.sh"
    networks:
      - math-buddy-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: math-buddy-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SQLALCHEMY_DATABASE_URL=sqlite:///./logs.db
    volumes:
      - ./logs.db:/app/logs.db
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - math-buddy-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: math-buddy-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - math-buddy-network

networks:
  math-buddy-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import: